<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <title>GEOFlow 发布助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">GEOFlow 发布助手</span>
      <span id="version" class="brand-version"></span>
    </div>
    <div class="topbar-right">
      <span id="instance" class="instance"></span>
      <span id="connection" class="badge badge-gray">未连接</span>
      <button id="discover" class="btn">连接本机 GEOFlow</button>
    </div>
  </header>

  <section id="pairing" class="card pairing hidden">
    <div class="pairing-text">
      <strong>配对码：<span id="user-code">…</span></strong>
      <p>点「打开审批页面」确认一次，发布助手会自动完成连接。</p>
    </div>
    <div class="pairing-actions">
      <button id="approve" class="btn">打开审批页面</button>
    </div>
  </section>

  <section id="update-card" class="card update hidden">
    <span id="update-version"></span>
    <button id="install-update" class="btn btn-primary">下载并安装更新</button>
  </section>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>账号管理</h2>
        <button id="refresh" class="btn btn-small">刷新</button>
      </div>
      <div class="syncbar">
        <button id="sync" class="btn btn-primary" disabled>同步全部已审核草稿</button>
        <p class="sync-hint">自动处理全部已绑定账号，无需再勾选。</p>
        <div class="autosync">
          <label class="autosync-toggle"><input type="checkbox" id="autosync-enabled"> 自动同步</label>
          <label class="autosync-interval">每 <input type="number" id="autosync-interval" min="1" max="1440" step="1"> 分钟</label>
          <button id="autosync-save" class="btn btn-small">保存</button>
        </div>
      </div>
      <div id="groups" class="groups"></div>
    </aside>

    <section class="workarea">
      <div id="tabs" class="tabs"></div>
      <div id="webview-host" class="webview-host">
        <div id="empty-tip" class="empty-tip">
          <p>在左侧点「登录并绑定」，这里会打开对应平台。</p>
          <p>登录后助手会自动识别账号，你只需核对一次。</p>
        </div>
      </div>
      <div class="logwrap">
        <div class="loghead"><span>运行记录</span><button id="clear-log" class="btn btn-small">清空</button></div>
        <div id="log" class="log"></div>
      </div>
    </section>
  </main>

  <div id="modal-mask" class="modal-mask hidden">
    <div class="modal" role="dialog">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
