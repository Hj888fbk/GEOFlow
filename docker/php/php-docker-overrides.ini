; 容器内 PHP 通用项（与 OPcache 互补）
expose_php=Off
; 保留异常位置与调用栈，省略可能包含凭据的函数参数。
zend.exception_ignore_args=On
realpath_cache_size=4096K
realpath_cache_ttl=600

; 文章编辑器单图允许 20MB；预留 multipart 开销并与 Nginx client_max_body_size 对齐。
; ImageLibraryController 仍有自己的约 10MB 业务校验，多图一次提交依赖 post_max_size。
upload_max_filesize = 24M
post_max_size = 64M
